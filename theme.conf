[General]

background="assets/wallpaper.jpg"
avatar="assets/avatar.png"

font="Open Runde"
dateFormat="dddd, MMMM d"
timeFormat="h:mm ap"


# ==========================================
# MACSDDM APPEARANCE SETTINGS
# ==========================================

# TYPOGRAPHY
# Examples: Inter, Open Runde, Noto Sans.
clockFont="auto"
dateFont="Open Runde"

# Clock size in logical pixels.
clockSize=176

# Font weights: 400 Regular, 500 Medium,
# 600 SemiBold, 700 Bold, 800 ExtraBold, 900 Black.
clockWeight=680

dateSize=25
dateWeight=600

# CLOCK
# true = Liquid Glass, false = normal text.
clockGlass=true

clockColor="#FFFFFF"
clockOpacity=1.0

# LIQUID GLASS CLOCK
glassTint="#C8D4E3"
glassIntensity=0.34
glassRefraction=13

# DATE
dateColor="#E8EEF6"
dateOpacity=1.0

# BACKGROUND BLUR
backgroundBlur=0.55

# PASSWORD FIELD
passwordGlass=true
passwordOpacity=1.0

passwordThickness=14
passwordStrength=0.82
passwordTint=0.08
passwordRim=0.22

# Used when passwordGlass=false.
passwordFallbackColor="#1F2028"
passwordFallbackOpacity=0.48
